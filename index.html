<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soporte y mantenimiento - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <header>
            <div class="container">
                <h3 id="index-title">Tickets de Soporte y Mantenimiento</h3>
            </div>
        </header>
        
        <!-- SECCIÓN DE RESUMEN -->
        <section id="tickets-resume" class="pt-2">
            <div class="container">
                <div id="tickets-resume-container" class="row">
                    <div class="col-md-6 col-lg-3">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-earmark-binary" viewBox="0 0 16 16">
                                        <path d="M7.05 11.885c0 1.415-.548 2.206-1.524 2.206C4.548 14.09 4 13.3 4 11.885c0-1.412.548-2.203 1.526-2.203.976 0 1.524.79 1.524 2.203m-1.524-1.612c-.542 0-.832.563-.832 1.612q0 .133.006.252l1.559-1.143c-.126-.474-.375-.72-.733-.72zm-.732 2.508c.126.472.372.718.732.718.54 0 .83-.563.83-1.614q0-.129-.006-.25zm6.061.624V14h-3v-.595h1.181V10.5h-.05l-1.136.747v-.688l1.19-.786h.69v3.633z"/>
                                        <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
                                    </svg>
                                </div>
                                <div class="card-text ms-3">
                                    <p>Tickets totales</p>
                                    <p id="tickets-text" class="general-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-earmark-minus" viewBox="0 0 16 16">
                                        <path d="M5.5 9a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5"/>
                                        <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
                                    </svg>
                                </div>
                                <div class="card-text ms-3">
                                    <p>Pendientes</p>
                                    <p id="pending-text" class="general-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-earmark-check" viewBox="0 0 16 16">
                                        <path d="M10.854 7.854a.5.5 0 0 0-.708-.708L7.5 9.793 6.354 8.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"/>
                                        <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
                                    </svg>
                                </div>
                                <div class="card-text ms-3">
                                    <p>Finalizados</p>
                                    <p id="finished-text" class="general-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="card resume-card mt-2">
                            <div class="card-body d-flex align-items-center">
                                <div class="icon-circle">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-stopwatch" viewBox="0 0 16 16">
                                        <path d="M8.5 5.6a.5.5 0 1 0-1 0v2.9h-3a.5.5 0 0 0 0 1H8a.5.5 0 0 0 .5-.5z"/>
                                        <path d="M6.5 1A.5.5 0 0 1 7 .5h2a.5.5 0 0 1 0 1v.57c1.36.196 2.594.78 3.584 1.64l.012-.013.354-.354-.354-.353a.5.5 0 0 1 .707-.708l1.414 1.415a.5.5 0 1 1-.707.707l-.353-.354-.354.354-.013.012A7 7 0 1 1 7 2.071V1.5a.5.5 0 0 1-.5-.5M8 3a6 6 0 1 0 .001 12A6 6 0 0 0 8 3"/>
                                    </svg>
                                </div>
                                <div class="card-text ms-3">
                                    <p>Prom. respuesta</p>
                                    <p id="average-text" class="general-report-cant text-muted">-</p>
                                </div>
                            </div>
                        </div>
                    </div>           
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE RECIENTES -->
        <section id="recent-table">
            <div id="recent-container" class="container pt-3">
                <div class="row ps-3 pe-3 pb-3">
                    <div class="col-6 col-md-9 col-lg-10">
                        <h4>Solicitudes de hoy</h4>
                    </div>
                    <div class="col-6 col-md-3 col-lg-2 d-flex justify-content-end">
                        <h5 id="dateHeader" class="fw-bold">- / - / -</h5>
                    </div>
                </div>
                <div class="row ms-2 me-2 d-none">
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <input type="hidden" class="form-control" id="type-filter" value="0">
                    </div>
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <input type="hidden" class="form-control" id="start-date">
                    </div>
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <input type="hidden" class="form-control" id="end-date">
                    </div>
                </div>
                <div id="register-container" class="container table-responsive row justify-content-center p-0">
                    <div class="col-lg-10">
                        <table id="register-table" class="table table-hover">
                            <thead>
                                <tr class="table-light">
                                    <th class="p-3 ps-4">ID</th>
                                    <th class="p-3 ps-2">SOLICITANTE</th>
                                    <th class="p-3 ps-2">EQUIPO</th>
                                    <th class="text-center p-3">PRIORIDAD</th>
                                    <th class="text-center p-3">ESTADO</th>
                                    <th class="text-center p-3">PROGRESO</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE ACCESOS DIRECTOS -->
        <section id="direct-access" class="pb-5">
            <div class="container mt-3">
                <h4>Accesos directos</h4>
                <div id="direct-access-container" class="mt-2">
                    <a href="./tickets.html" class="card access-card mt-3 text-decoration-none">
                        <div id="client-access" class="card-body d-flex align-items-center">
                            <div class="icon-square me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-earmark-arrow-up" viewBox="0 0 16 16">
                                    <path d="M8.5 11.5a.5.5 0 0 1-1 0V7.707L6.354 8.854a.5.5 0 1 1-.708-.708l2-2a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 7.707z"/>
                                    <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
                                </svg>
                            </div>
                            <p class="fw-bold">Levantar nuevo ticket</p>
                        </div>
                    </a>
                    <a href="./report.html" class="card access-card mt-2 text-decoration-none d-none" data-mant-only>
                        <div id="order-access" class="card-body d-flex align-items-center">
                            <div class="icon-square me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-clipboard-data" viewBox="0 0 16 16">
                                    <path d="M4 11a1 1 0 1 1 2 0v1a1 1 0 1 1-2 0zm6-4a1 1 0 1 1 2 0v5a1 1 0 1 1-2 0zM7 9a1 1 0 0 1 2 0v3a1 1 0 1 1-2 0z"/>
                                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
                                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
                                </svg>
                            </div>
                            <p class="fw-bold">Generar reportes</p>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
