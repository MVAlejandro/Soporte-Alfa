<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo ticket - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="tickets-header">
            <div id="tickets-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-tools" viewBox="0 0 16 16">
                                <path d="M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .708.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 1 0 5.878-.851l2.654-2.617.968.968-.305.914a1 1 0 0 0 .242 1.023l3.27 3.27a.997.997 0 0 0 1.414 0l1.586-1.586a.997.997 0 0 0 0-1.414l-3.27-3.27a1 1 0 0 0-1.023-.242L10.5 9.5l-.96-.96 2.68-2.643A3.005 3.005 0 0 0 16 3q0-.405-.102-.777l-2.14 2.141L12 4l-.364-1.757L13.777.102a3 3 0 0 0-3.675 3.68L7.462 6.46 4.793 3.793a1 1 0 0 1-.293-.707v-.071a1 1 0 0 0-.419-.814zm9.646 10.646a.5.5 0 0 1 .708 0l2.914 2.915a.5.5 0 0 1-.707.707l-2.915-2.914a.5.5 0 0 1 0-.708M3 11l.471.242.529.026.287.445.445.287.026.529L5 13l-.242.471-.026.529-.445.287-.287.445-.529.026L3 15l-.471-.242L2 14.732l-.287-.445L1.268 14l-.026-.529L1 13l.242-.471.026-.529.445-.287.287-.445.529-.026z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Solicitar mantenimiento</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-client" class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal" data-bs-target="#edit-modal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-2">Generar Ticket</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="tickets-form">
            <div id="tickets-form-container" class="container pt-4 pb-3">
                <div class="row pb-3 mb-2">
                    <div class="col d-flex align-items-center">
                        <h5 class="ms-4">Generar Nuevo Ticket</h5>
                    </div>
                </div>
                <!-- Formulario de programación -->
                <form id="ticket-form">
                    <div class="row ms-2 me-2">
                        <div class="col-md form-column">
                            <div class="form-title d-flex align-items-center pb-3">
                                <div class="ms-2 me-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                                    </svg>
                                </div>
                                <h5>Datos del solicitante</h5>
                            </div>
                            <div class="ms-2 me-2 pt-3 pb-3">
                                <div class="label-over-border">
                                    <label for="emplyee" class="form-label m-2">Solicitante</label>
                                    <select id="emplyee" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>

                                    </select>
                                    <p class="error invalid-feedback" id="emplyee-error" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="ms-2 me-2 pt-2 pb-3">
                                <div class="label-over-border">
                                    <label for="departament" class="form-label m-2">Departamento</label>
                                    <input type="text" id="departament" class="form-control" placeholder="Departamento perteneciente" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="col-md form-column">
                            <div class="form-title d-flex align-items-center pb-3">
                                <div class="ms-2 me-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-printer-fill" viewBox="0 0 16 16">
                                        <path d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1"/>
                                        <path d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
                                    </svg>
                                </div>
                                <h5>Datos del equipo</h5>
                            </div>
                            <div class="ms-2 me-2 pt-3 pb-3">
                                <div class="label-over-border">
                                    <label for="unit" class="form-label m-2">Equipo</label>
                                    <select id="unit" class="form-select" aria-label="Default select example" disabled>
                                        <option value="0">Seleccione...</option>

                                    </select>
                                    <p class="error invalid-feedback" id="unit-error" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="ms-2 me-2 pt-2 pb-3">
                                <div class="label-over-border">
                                    <label for="observations" class="form-label m-2">Observaciones</label>
                                    <input type="text" id="observations" class="form-control" placeholder="Observaciones adicionales">
                                    <p class="error invalid-feedback" id="observations-error" style="color: red;"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row ms-2 me-2">
                        <div id="service-title" class="form-title d-flex align-items-center pb-3">
                        <div class="ms-2 me-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                            </svg>
                        </div>
                        <h5>Datos del servicio</h5>
                    </div>
                        <div class="col-md-6 col-lg-7">
                            <div class="ms-2 me-2 pt-3 pb-3">
                                <div class="label-over-border">
                                    <label for="description" class="form-label m-2">Descripción</label>
                                    <textarea id="description" class="form-control" rows="8" placeholder="Descripción detallada de la solicitud"></textarea>
                                    <p class="error invalid-feedback" id="description-error" style="color: red;"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-5 form-column">
                            <div class="ms-2 me-2 pb-3">
                                <label for="description" class="form-label label ms-2 me-2 mb-2">Prioridad</label>
                                <div class="row g-2">
                                    <div class="col d-flex priority-container">
                                        <input type="radio" class="btn-check" name="priority" id="p-prevent">
                                        <label class="btn btn-priority" for="p-prevent">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clock-history" viewBox="0 0 16 16">
                                                <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z"/>
                                                <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z"/>
                                                <path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5"/>
                                            </svg>
                                            <p class="ps-2">Preventivo</p>
                                        </label>
                                    </div>
                                    <div class="col d-flex priority-container">
                                        <input type="radio" class="btn-check" name="priority" id="p-important">
                                        <label class="btn btn-priority" for="p-important">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-circle" viewBox="0 0 16 16">
                                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                                <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                            </svg>
                                            <p class="ps-2">Importante</p>
                                        </label>
                                    </div>
                                </div>
                                <div class="row g-2 mt-2">
                                    <div class="col d-flex priority-container">
                                        <input type="radio" class="btn-check" name="priority" id="p-urgent">
                                        <label class="btn btn-priority" for="p-urgent">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
                                                <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
                                                <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                                            </svg>
                                            <p class="ps-2">Urgente</p>
                                        </label>
                                    </div>
                                    <div class="col d-flex priority-container">
                                        <input type="radio" class="btn-check" name="priority" id="p-vUrgent">
                                        <label class="btn btn-priority" for="p-vUrgent">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-fire" viewBox="0 0 16 16">
                                                <path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16m0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15"/>
                                            </svg>
                                            <p class="ps-2">Muy urgente</p>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-end pt-1 me-3">
                        <button id="btn-cancel" type="button" class="btn btn-secondary d-flex align-items-center ps-3 pe-3 me-2">Cancelar</button>
                        <button id="btn-add" type="button" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
                                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
                            </svg>
                            <p class="ps-2">Generar</p>
                        </button>
                    </div>
                </form> 
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="tickets-filter">
            <div class="container pt-3 pb-3">
                <h5>Listado de Tickets</h5>
            </div>
            <div id="tickets-filter-container" class="container pt-4 pb-3">
                <div class="row ms-2 me-2">
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <label for="client-filter" class="form-label m-2">Filtrar por Solicitante</label>
                        <select class="form-select" id="client-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <label for="priority-filter" class="form-label m-2">Filtrar por Prioridad</label>
                        <select class="form-select" id="priority-filter">
                            <option value="0">Todos</option>
                            <option value="Preventivo">Preventivo</option>
                            <option value="Importante">Importante</option>
                            <option value="Urgente">Urgente</option>
                            <option value="Muy urgente">Muy urgente</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-4 d-flex align-items-center label-over-border filter">
                        <label for="status-filter" class="form-label m-2">Filtrar por Estado</label>
                        <select class="form-select" id="status-filter">
                            <option value="0">Todos</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Inconcluso">Inconcluso</option>
                            <option value="Terminado">Terminado</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="tickets-register">
            <div class="container table-responsive p-0">
                <table id="tickets-table" class="table table-hover align-middle">
                    <thead>
                        <tr class="table-light">
                            <th class="p-3 ps-4">ID</th>
                            <th class="p-3">SOLICITANTE</th>
                            <th class="p-3">EQUIPO</th>
                            <th class="p-3">PRIORIDAD</th>
                            <th class="p-3">ESTADO</th>
                            <th class="p-3">PROGRESO</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="text-center" colspan="8">No hay tickets registrados</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN DE PAGINACIÓN -->
        <section id="tickets-pages" class="pb-4">
            <div id="tickets-pages-container" class="container pt-3 pb-3">
                <div class="row ms-2 align-items-center">
                    <div class="col-6 col-lg-9">
                        <p id="tickets-pages-results"></p>
                    </div>
                    <div class="col-6 col-lg-3">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination mb-0">
                                <!-- Los botones se llenan dinámicamente desde JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Actualizar ticket</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="ticket-edit-form">
                            <input type="hidden" id="edit-id-ticket">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 col-lg-3 label-over-border edit">
                                    <label for="edit-id" class="form-label m-2">ID</label>
                                    <input type="text" class="form-control" id="edit-id" disabled>
                                </div>
                                <div class="col-md-4 col-lg-3 ms-auto label-over-border edit">
                                    <label for="edit-sol-date" class="form-label m-2">Fecha solicitud</label>
                                    <input type="text" class="form-control" id="edit-sol-date" disabled>
                                </div>
                                <div class="col-md-4 col-lg-3 label-over-border edit">
                                    <label for="edit-finish-date" class="form-label m-2">Fecha finalizado</label>
                                    <input type="text" class="form-control" id="edit-finish-date" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-employee" class="form-label m-2">Solicitante</label>
                                    <input type="text" class="form-control" id="edit-employee" disabled>
                                </div>
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-unit" class="form-label m-2">Equipo</label>
                                    <input type="text" class="form-control" id="edit-unit" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-departament" class="form-label m-2">Departamento</label>
                                    <input type="text" class="form-control" id="edit-departament" disabled>
                                </div>
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-priority" class="form-label m-2">Prioridad</label>
                                    <input type="text" class="form-control" id="edit-priority" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                        <option value="Pendiente">Pendiente</option>
                                        <option value="Inconcluso">Inconcluso</option>
                                        <option value="Terminado">Terminado</option>
                                        <option value="Cancelado">Cancelado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 label-over-border edit">
                                    <label for="edit-progress" class="form-label m-2">Progreso</label>
                                    <select id="edit-progress" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                        <option value="Abierto">Abierto</option>
                                        <option value="Terminado">Terminado</option>
                                        <option value="Cancelado">Cancelado</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editProgress" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col label-over-border edit">
